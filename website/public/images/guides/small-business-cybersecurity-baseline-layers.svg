<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <!-- Card Background -->
  <rect width="1200" height="560" rx="20" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="558" rx="19" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="40" y="32" width="280" height="26" rx="6" fill="#CCFBF1"/>
  <text x="50" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E" letter-spacing="0.08em">SECURITY ARCHITECTURE</text>
  <text x="40" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">The Five Essential Small Business Defense Layers</text>
  <text x="40" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">A balanced security program addresses five operational layers rather than relying on a single technical tool.</text>

  <!-- Layer 1: Accounts & Identity -->
  <g transform="translate(40, 136)">
    <rect width="216" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="216" height="8" rx="4" fill="#0F766E"/>
    
    <rect x="20" y="24" width="40" height="40" rx="10" fill="#CCFBF1"/>
    <!-- Key icon -->
    <circle cx="40" cy="44" r="8" stroke="#0F766E" stroke-width="3" fill="none"/>
    <path d="M46 50L54 58M51 55L53 53" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>

    <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">1. Identity &amp; Access</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">First Line of Defense</text>

    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Core Controls:</text>
    <text x="20" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Multi-factor authentication</text>
    <text x="20" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Business password vault</text>
    <text x="20" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Unique long passphrases</text>
    <text x="20" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Separate admin accounts</text>
    <text x="20" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Prompt offboarding</text>

    <rect x="16" y="300" width="184" height="64" rx="8" fill="#F0FDFA"/>
    <text x="26" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E">WHY IT MATTERS</text>
    <text x="26" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#134E4A">Prevents 90%+ of automated</text>
    <text x="26" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#134E4A">account takeovers.</text>
  </g>

  <!-- Layer 2: Email & Phishing -->
  <g transform="translate(272, 136)">
    <rect width="216" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="216" height="8" rx="4" fill="#0284C7"/>
    
    <rect x="20" y="24" width="40" height="40" rx="10" fill="#E0F2FE"/>
    <!-- Mail icon -->
    <rect x="28" y="34" width="24" height="18" rx="3" stroke="#0284C7" stroke-width="2" fill="none"/>
    <path d="M29 36L40 44L51 36" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>

    <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">2. Email &amp; Comms</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0284C7">Deception Defense</text>

    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Core Controls:</text>
    <text x="20" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Phishing awareness habits</text>
    <text x="20" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Out-of-band payment check</text>
    <text x="20" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• SPF, DKIM, DMARC records</text>
    <text x="20" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Mailbox rule auditing</text>
    <text x="20" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Dual approval for transfers</text>

    <rect x="16" y="300" width="184" height="64" rx="8" fill="#F0F9FF"/>
    <text x="26" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284C7">WHY IT MATTERS</text>
    <text x="26" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#075985">Stops invoice fraud and</text>
    <text x="26" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#075985">social engineering loss.</text>
  </g>

  <!-- Layer 3: Devices & Software -->
  <g transform="translate(504, 136)">
    <rect width="216" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="216" height="8" rx="4" fill="#6366F1"/>
    
    <rect x="20" y="24" width="40" height="40" rx="10" fill="#EEF2FF"/>
    <!-- Laptop icon -->
    <rect x="28" y="34" width="24" height="16" rx="2" stroke="#6366F1" stroke-width="2" fill="none"/>
    <line x1="24" y1="52" x2="56" y2="52" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>

    <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">3. Work Devices</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6366F1">Endpoint Protection</text>

    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Core Controls:</text>
    <text x="20" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Automatic OS/app updates</text>
    <text x="20" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• BitLocker/FileVault encryption</text>
    <text x="20" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Non-administrator accounts</text>
    <text x="20" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Automatic screen lockouts</text>
    <text x="20" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Remote wipe capabilities</text>

    <rect x="16" y="300" width="184" height="64" rx="8" fill="#EEF2FF"/>
    <text x="26" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4F46E5">WHY IT MATTERS</text>
    <text x="26" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3730A3">Protects client data if a</text>
    <text x="26" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3730A3">laptop is stolen or lost.</text>
  </g>

  <!-- Layer 4: Data & Backups -->
  <g transform="translate(736, 136)">
    <rect width="216" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="216" height="8" rx="4" fill="#059669"/>
    
    <rect x="20" y="24" width="40" height="40" rx="10" fill="#D1FAE5"/>
    <!-- Database/Backup icon -->
    <ellipse cx="40" cy="35" rx="12" ry="5" stroke="#059669" stroke-width="2" fill="none"/>
    <path d="M28 35V45C28 48 33 50 40 50C47 50 52 48 52 45V35" stroke="#059669" stroke-width="2"/>
    <path d="M28 45V55C28 58 33 60 40 60C47 60 52 58 52 55V45" stroke="#059669" stroke-width="2"/>

    <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">4. Data &amp; Recovery</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#059669">Business Continuity</text>

    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Core Controls:</text>
    <text x="20" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• 3-2-1 backup strategy</text>
    <text x="20" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Separated/immutable storage</text>
    <text x="20" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Independent SaaS backup</text>
    <text x="20" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Role-based data access</text>
    <text x="20" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Regular test restoration</text>

    <rect x="16" y="300" width="184" height="64" rx="8" fill="#ECFDF5"/>
    <text x="26" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669">WHY IT MATTERS</text>
    <text x="26" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065F46">Guarantees recovery from</text>
    <text x="26" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065F46">ransomware or wipeouts.</text>
  </g>

  <!-- Layer 5: Incident Readiness -->
  <g transform="translate(968, 136)">
    <rect width="192" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="192" height="8" rx="4" fill="#D97706"/>
    
    <rect x="20" y="24" width="40" height="40" rx="10" fill="#FEF3C7"/>
    <!-- Siren/Alert icon -->
    <path d="M40 32C33 32 28 38 28 46H52C52 38 47 32 40 32Z" stroke="#D97706" stroke-width="2" fill="none"/>
    <rect x="26" y="48" width="28" height="6" rx="2" fill="#D97706"/>

    <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">5. Incident Plan</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#D97706">Rapid Response</text>

    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Core Controls:</text>
    <text x="20" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• 1-page response plan</text>
    <text x="20" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Offline contact directory</text>
    <text x="20" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Bank fraud kill-chain</text>
    <text x="20" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Cyber insurance lead</text>
    <text x="20" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Annual practice drill</text>

    <rect x="16" y="300" width="160" height="64" rx="8" fill="#FFFBEB"/>
    <text x="26" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#B45309">WHY IT MATTERS</text>
    <text x="26" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400E">Limits financial damage</text>
    <text x="26" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400E">during emergencies.</text>
  </g>
</svg>
