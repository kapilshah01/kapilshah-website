<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" fill="none">
  <!-- Card Background -->
  <rect width="1200" height="540" rx="20" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="538" rx="19" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="40" y="32" width="280" height="26" rx="6" fill="#CCFBF1"/>
  <text x="50" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E" letter-spacing="0.08em">METHOD EVALUATION</text>
  <text x="40" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Comparing Multi-Factor Authentication Methods</text>
  <text x="40" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Choose the strongest factor supported by your service. Any MFA is better than passwords alone.</text>

  <!-- Column 1: SMS Text Messages -->
  <g transform="translate(40, 136)">
    <rect width="354" height="364" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="354" height="8" rx="4" fill="#94A3B8"/>
    
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#F1F5F9"/>
    <!-- Phone icon -->
    <rect x="36" y="32" width="20" height="28" rx="3" stroke="#64748B" stroke-width="2" fill="none"/>
    <circle cx="46" cy="54" r="1.5" fill="#64748B"/>

    <text x="80" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">SMS Text Codes</text>
    <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748B">Legacy Baseline</text>

    <!-- Ratings -->
    <rect x="24" y="84" width="306" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="36" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">Phishing Resistance:</text>
    <text x="170" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#DC2626">Low (Vulnerable to AiTM)</text>
    <text x="36" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">Setup Ease:</text>
    <text x="170" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669">High (No app needed)</text>

    <text x="24" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">How It Operates:</text>
    <text x="24" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Sends a 6-digit code via cell network</text>
    <text x="24" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Better than no MFA, but SIM swap risk exists</text>
    <text x="24" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Phishing pages can prompt and harvest codes</text>
    <text x="24" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Use only when no stronger option is offered</text>

    <rect x="24" y="278" width="306" height="66" rx="8" fill="#F8FAFC"/>
    <text x="36" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">RECOMMENDED USE</text>
    <text x="36" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Acceptable as fallback on low-impact tools;</text>
    <text x="36" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">avoid for email, banking, or administrators.</text>
  </g>

  <!-- Column 2: Authenticator Apps -->
  <g transform="translate(422, 136)">
    <rect width="354" height="364" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="0" y="0" width="354" height="8" rx="4" fill="#0F766E"/>
    
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#CCFBF1"/>
    <!-- App / Shield icon -->
    <path d="M46 32L36 36V44C36 50 40 55 46 57C52 55 56 50 56 44V36L46 32Z" stroke="#0F766E" stroke-width="2" fill="none"/>
    <path d="M42 44L45 47L51 41" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>

    <text x="80" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Authenticator Apps</text>
    <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">Small Business Sweet Spot</text>

    <!-- Ratings -->
    <rect x="24" y="84" width="306" height="52" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="36" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F766E">Phishing Resistance:</text>
    <text x="170" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284C7">Moderate to Strong</text>
    <text x="36" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F766E">Setup Ease:</text>
    <text x="170" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669">High (Free apps available)</text>

    <text x="24" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">How It Operates:</text>
    <text x="24" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Generates rotating time-based codes (TOTP)</text>
    <text x="24" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Push approvals with number matching</text>
    <text x="24" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Free tools: Microsoft, Google, or Bitwarden</text>
    <text x="24" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Requires backing up recovery codes safely</text>

    <rect x="24" y="278" width="306" height="66" rx="8" fill="#F0FDFA"/>
    <text x="36" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E">RECOMMENDED USE</text>
    <text x="36" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#134E4A">The default standard for all employee email, SaaS,</text>
    <text x="36" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#134E4A">cloud storage, and collaboration accounts.</text>
  </g>

  <!-- Column 3: Passkeys & Security Keys -->
  <g transform="translate(804, 136)">
    <rect width="354" height="364" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="354" height="8" rx="4" fill="#0284C7"/>
    
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#E0F2FE"/>
    <!-- Hardware Key / FIDO icon -->
    <rect x="36" y="36" width="20" height="14" rx="3" stroke="#0284C7" stroke-width="2" fill="none"/>
    <rect x="38" y="50" width="6" height="8" fill="#0284C7"/>
    <circle cx="46" cy="43" r="3" fill="#0284C7"/>

    <text x="80" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Passkeys &amp; FIDO</text>
    <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0284C7">Maximum Protection</text>

    <!-- Ratings -->
    <rect x="24" y="84" width="306" height="52" rx="8" fill="#F0F9FF" stroke="#BAE6FD"/>
    <text x="36" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0284C7">Phishing Resistance:</text>
    <text x="170" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669">Highest (Cryptographic)</text>
    <text x="36" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0284C7">Setup Ease:</text>
    <text x="170" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#D97706">Moderate (Hardware / setup)</text>

    <text x="24" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">How It Operates:</text>
    <text x="24" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Binds sign-in cryptographically to domain</text>
    <text x="24" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Immune to fake lookalike phishing websites</text>
    <text x="24" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Uses device biometrics or physical USB/NFC keys</text>
    <text x="24" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Requires registering at least two keys</text>

    <rect x="24" y="278" width="306" height="66" rx="8" fill="#F0F9FF"/>
    <text x="36" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284C7">RECOMMENDED USE</text>
    <text x="36" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#075985">Crucial for domain hosts, email global admins,</text>
    <text x="36" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#075985">financial controllers, and executive inboxes.</text>
  </g>
</svg>
