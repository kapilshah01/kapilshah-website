<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" fill="none">
  <!-- Card Background -->
  <rect width="1200" height="500" rx="20" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="498" rx="19" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="40" y="30" width="280" height="26" rx="6" fill="#CCFBF1"/>
  <text x="50" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E" letter-spacing="0.08em">GOVERNANCE STANDARD</text>
  <text x="40" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Modern Password Rules vs. Outdated Habits</text>
  <text x="40" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">NIST SP 800-63B standards emphasize length, password vaults, and MFA over arbitrary symbol tricks.</text>

  <!-- Left Card: Outdated Password Rules (Avoid) -->
  <g transform="translate(40, 128)">
    <rect width="540" height="336" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="8" rx="4" fill="#EF4444"/>
    
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#FEE2E2"/>
    <text x="46" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#DC2626" text-anchor="middle">✕</text>

    <text x="80" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Outdated Legacy Rules</text>
    <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#DC2626">Discouraged by NIST SP 800-63B</text>

    <text x="24" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Flawed Habits:</text>
    <text x="24" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Forced 30/60-day rotations: leads to predictable edits (`Spring2026!`, `Summer2026!`)</text>
    <text x="24" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Arbitrary complexity puzzles: requires 1 symbol, 1 number, causing short passwords</text>
    <text x="24" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Shared generic logins: team uses single `admin` or `info` account without accountability</text>
    <text x="24" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Spreadsheets &amp; notes: passwords copied in chat or taped under keyboards</text>

    <rect x="24" y="238" width="492" height="66" rx="8" fill="#FEF2F2"/>
    <text x="36" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991B1B">THE CONSEQUENCE</text>
    <text x="36" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7F1D1D">Creates friction that encourages employees to reuse passwords or</text>
    <text x="36" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7F1D1D">circumvent controls with insecure workarounds.</text>
  </g>

  <!-- Right Card: Modern NIST-Aligned Rules (Adopt) -->
  <g transform="translate(620, 128)">
    <rect width="540" height="336" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="8" rx="4" fill="#0F766E"/>
    
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#CCFBF1"/>
    <text x="46" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F766E" text-anchor="middle">✓</text>

    <text x="80" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Modern Practical Policy</text>
    <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">NIST SP 800-63B &amp; CISA Recommended</text>

    <text x="24" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Effective Rules:</text>
    <text x="24" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Length &amp; Passphrases: prioritize 15+ characters (`coffee-tractor-velvet-sunset`)</text>
    <text x="24" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Approved password vault: generate random credentials and autofill verified domains</text>
    <text x="24" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Multi-factor authentication: enforced on email, cloud storage, banking, and admins</text>
    <text x="24" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Event-driven change: change passwords only when evidence of compromise exists</text>

    <rect x="24" y="238" width="492" height="66" rx="8" fill="#F0FDFA"/>
    <text x="36" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E">THE BENEFIT</text>
    <text x="36" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#134E4A">Maximizes resistance to automated credential stuffing while making</text>
    <text x="36" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#134E4A">daily sign-in fast, friction-free, and easy for staff to follow.</text>
  </g>
</svg>
