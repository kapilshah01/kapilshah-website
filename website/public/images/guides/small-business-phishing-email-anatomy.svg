<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" fill="none">
  <!-- Card Background -->
  <rect width="1200" height="580" rx="20" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="578" rx="19" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="40" y="30" width="280" height="26" rx="6" fill="#FEE2E2"/>
  <text x="50" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#DC2626" letter-spacing="0.08em">THREAT DECONSTRUCTION</text>
  <text x="40" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Anatomy of a Deceptive Phishing Email</text>
  <text x="40" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Five subtle cues that reveal a fraudulent message before you click, sign in, or wire money.</text>

  <!-- Left: Mock Email Window (width: 700) -->
  <g transform="translate(40, 130)">
    <!-- Email Frame -->
    <rect width="700" height="410" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Title bar -->
    <rect width="700" height="38" rx="12" fill="#F1F5F9"/>
    <rect y="26" width="700" height="12" fill="#F1F5F9"/>
    <circle cx="20" cy="19" r="5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5" fill="#10B981"/>
    <text x="76" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748B">Inbox — Message Preview</text>

    <!-- Sender Header -->
    <g transform="translate(24, 54)">
      <rect width="652" height="66" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
      <circle cx="28" cy="33" r="14" fill="#DC2626"/>
      <text x="28" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
      
      <text x="54" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Microsoft 365 Support Team</text>
      <text x="250" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#DC2626">&lt;support@msft-security-notice.com&gt;</text>
      <text x="54" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Subject: <tspan font-weight="700" fill="#B91C1C">URGENT: Password Expiry Notification - Immediate Action Required</tspan></text>
    </g>

    <!-- Email Body Text -->
    <g transform="translate(24, 136)">
      <!-- Callout pointer 2: Urgency -->
      <rect x="0" y="0" width="652" height="42" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
      <circle cx="18" cy="21" r="10" fill="#D97706"/>
      <text x="18" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="36" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400E">Your business mailbox will be suspended within 3 hours due to unverified activity.</text>

      <text x="0" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">Dear Valued User,</text>
      <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">To prevent service termination and preserve incoming business emails, verify your account credentials:</text>

      <!-- Deceptive Link -->
      <g transform="translate(0, 108)">
        <rect width="220" height="36" rx="6" fill="#0284C7"/>
        <text x="110" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Keep Current Password</text>
        <circle cx="236" cy="18" r="10" fill="#0284C7"/>
        <text x="236" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

        <!-- Hover Preview Balloon -->
        <rect x="0" y="44" width="380" height="28" rx="4" fill="#0F172A"/>
        <text x="12" y="62" font-family="monospace" font-size="11" fill="#38BDF8">https://login.microsoftonline.com.auth-redirect.co/verify</text>
      </g>

      <!-- Attachment Box -->
      <g transform="translate(0, 190)">
        <rect width="320" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
        <circle cx="18" cy="21" r="10" fill="#DC2626"/>
        <text x="18" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
        <!-- Document icon -->
        <path d="M38 13H46L50 17V29H38V13Z" stroke="#64748B" stroke-width="1.5" fill="none"/>
        <text x="56" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Security_Audit_Report.pdf.exe</text>
        <text x="56" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#DC2626">Hidden double extension (.exe)</text>
      </g>
    </g>
  </g>

  <!-- Right: 4 Callout Legend Cards (width: 396) -->
  <g transform="translate(764, 130)">
    <!-- Item 1 -->
    <rect y="0" width="396" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="#FEE2E2"/>
    <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">1</text>
    <text x="46" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Lookalike Domain &amp; Spoofed Name</text>
    <text x="16" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">The display name mimics a known vendor, but expanding the full address reveals a rogue external domain (`msft-security-notice.com`).</text>

    <!-- Item 2 -->
    <rect y="104" width="396" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="24" cy="128" r="12" fill="#FEF3C7"/>
    <text x="24" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">2</text>
    <text x="46" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Artificial Urgency &amp; Pressure</text>
    <text x="16" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Threatening immediate suspension (e.g. "within 3 hours") creates panic so employees act before consulting colleagues or checking records.</text>

    <!-- Item 3 -->
    <rect y="208" width="396" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="24" cy="232" r="12" fill="#E0F2FE"/>
    <text x="24" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle">3</text>
    <text x="46" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Deceptive Hyperlink Destination</text>
    <text x="16" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Hovering over the button reveals the true URL leads to a credential-harvesting proxy rather than Microsoft’s actual sign-in portal.</text>

    <!-- Item 4 -->
    <rect y="312" width="396" height="98" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="24" cy="336" r="12" fill="#FEE2E2"/>
    <text x="24" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">4</text>
    <text x="46" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Unexpected or Executable File</text>
    <text x="16" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Attachments disguised as invoices or reports may carry hidden extensions or malicious macros. Never open unverified attachments.</text>
  </g>
</svg>
