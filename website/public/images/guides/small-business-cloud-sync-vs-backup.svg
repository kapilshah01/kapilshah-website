<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" fill="none">
  <!-- Card Background -->
  <rect width="1200" height="540" rx="20" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="538" rx="19" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="40" y="32" width="280" height="26" rx="6" fill="#FEF3C7"/>
  <text x="50" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309" letter-spacing="0.08em">RECOVERY ARCHITECTURE</text>
  <text x="40" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Cloud File Sync vs. True Separated Backup</text>
  <text x="40" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Synchronized storage is designed for collaboration; it does not replace protected, immutable backups.</text>

  <!-- Left Card: Cloud File Sync (Vulnerable) -->
  <g transform="translate(40, 136)">
    <rect width="540" height="364" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="8" rx="4" fill="#EF4444"/>
    
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#FEE2E2"/>
    <!-- Sync arrows icon -->
    <path d="M46 32V38M46 38L52 35M46 38L40 35" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
    <path d="M46 60V54M46 54L40 57M46 54L52 57" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
    <path d="M54 42C56 46 54 52 48 54M38 50C36 46 38 40 44 38" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>

    <text x="80" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Cloud File Synchronization</text>
    <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#DC2626">Live Mirroring (OneDrive, Google Drive, Dropbox)</text>

    <!-- Diagram representation -->
    <rect x="24" y="84" width="492" height="74" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
    <text x="36" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991B1B">THE DANGER: IMMEDIATE REPLICATION</text>
    <text x="36" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7F1D1D">Local Device (Ransomware / File Deletion)</text>
    <text x="330" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#DC2626">──► SYNC ──►</text>
    <text x="424" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7F1D1D">Cloud Mirror</text>
    <text x="36" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991B1B">Encrypted or deleted files immediately replace good copies in the cloud.</text>

    <text x="24" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Operational Limitations:</text>
    <text x="24" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Shared access: deleted files sync across all team members' laptops</text>
    <text x="24" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Same everyday login controls both the computer and cloud storage</text>
    <text x="24" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Version histories can be purged or overwritten during ransomware attacks</text>
    <text x="24" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• No air-gap: compromised admin accounts can delete everything</text>

    <rect x="24" y="296" width="492" height="48" rx="8" fill="#FEF2F2"/>
    <text x="36" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991B1B">VERDICT: COLLABORATION TOOL, NOT BACKUP</text>
    <text x="36" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7F1D1D">Great for team file sharing, but vulnerable to ransomware and account takeover.</text>
  </g>

  <!-- Right Card: True Separated Backup (Protected) -->
  <g transform="translate(620, 136)">
    <rect width="540" height="364" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="8" rx="4" fill="#0F766E"/>
    
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#CCFBF1"/>
    <!-- Vault / Shield icon -->
    <rect x="36" y="32" width="20" height="26" rx="4" stroke="#0F766E" stroke-width="2" fill="none"/>
    <circle cx="46" cy="45" r="4" fill="#0F766E"/>

    <text x="80" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A">True Separated Backup</text>
    <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">Immutable, Versioned Recovery</text>

    <!-- Diagram representation -->
    <rect x="24" y="84" width="492" height="74" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="36" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E">THE PROTECTION: SEPARATION &amp; IMMUTABILITY</text>
    <text x="36" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#134E4A">Workstation Data</text>
    <text x="180" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E">──► SNAPSHOT ──►</text>
    <text x="310" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E">[ PROTECTED VAULT ]</text>
    <text x="36" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#115E59">Cannot be altered, encrypted, or deleted by standard daily user credentials.</text>

    <text x="24" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Operational Safeguards:</text>
    <text x="24" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Point-in-time historical snapshots: roll back to before the infection</text>
    <text x="24" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Independent credentials &amp; separate MFA: ransomware cannot delete copies</text>
    <text x="24" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Immutable retention locks: prevents unauthorized deletion for X days</text>
    <text x="24" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Tested quarterly restores: proves data can be safely recovered in hours</text>

    <rect x="24" y="296" width="492" height="48" rx="8" fill="#F0FDFA"/>
    <text x="36" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E">VERDICT: RESILIENT BUSINESS CONTINUITY</text>
    <text x="36" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#134E4A">Guarantees your business can recover its records even if devices are compromised.</text>
  </g>
</svg>
