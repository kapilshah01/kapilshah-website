<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <!-- Card Background -->
  <rect width="1200" height="560" rx="20" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="558" rx="19" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="40" y="32" width="230" height="26" rx="6" fill="#EFF6FF"/>
  <text x="50" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" letter-spacing="0.08em">APPLICATION READINESS</text>
  <text x="40" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Cyber Insurance Readiness &amp; Evidence Workflow</text>
  <text x="40" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">A structured pre-application preparation sequence: understand controls, organize documentation, and avoid inaccurate representations.</text>

  <!-- Stage 1: Operational Baseline -->
  <g transform="translate(40, 136)">
    <rect width="216" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="216" height="8" rx="4" fill="#2563EB"/>
    
    <rect x="16" y="24" width="36" height="36" rx="8" fill="#DBEAFE"/>
    <!-- Shield / check icon -->
    <path d="M34 32L43 36V43C43 48.5 39.2 53.7 34 55C28.8 53.7 25 48.5 25 43V36L34 32Z" stroke="#2563EB" stroke-width="2" fill="none"/>
    <path d="M30 43L33 46L39 40" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="16" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">1. Operational Baseline</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563EB">Verify Core Controls</text>

    <text x="16" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">What Insurers Look For:</text>
    <text x="16" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• MFA on remote/cloud/admin</text>
    <text x="16" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Segmented/immutable backups</text>
    <text x="16" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Zero internet-exposed RDP</text>
    <text x="16" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Payment callback verification</text>
    <text x="16" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Supported OS &amp; software</text>

    <rect x="12" y="296" width="192" height="72" rx="6" fill="#EFF6FF"/>
    <text x="20" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1D4ED8">OBJECTIVE</text>
    <text x="20" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1E3A8A">Ensure baseline security</text>
    <text x="20" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1E3A8A">hygiene is truly running.</text>
  </g>

  <!-- Stage 2: Evidence Gathering -->
  <g transform="translate(272, 136)">
    <rect width="216" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="216" height="8" rx="4" fill="#0D9488"/>
    
    <rect x="16" y="24" width="36" height="36" rx="8" fill="#CCFBF1"/>
    <!-- Document / log icon -->
    <rect x="24" y="33" width="20" height="24" rx="2" stroke="#0D9488" stroke-width="2" fill="none"/>
    <path d="M28 39H36M28 44H36M28 49H33" stroke="#0D9488" stroke-width="2" stroke-linecap="round"/>

    <text x="16" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">2. Evidence Gathering</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0D9488">Assemble Documentation</text>

    <text x="16" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">Artifacts to Prepare:</text>
    <text x="16" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Admin MFA policy exports</text>
    <text x="16" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Storage immutability configs</text>
    <text x="16" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Signed restore drill log</text>
    <text x="16" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Written wire transfer SOP</text>
    <text x="16" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Emergency response sheet</text>

    <rect x="12" y="296" width="192" height="72" rx="6" fill="#F0FDFA"/>
    <text x="20" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F766E">OBJECTIVE</text>
    <text x="20" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#134E4A">Turn verbal claims into</text>
    <text x="20" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#134E4A">verifiable audit records.</text>
  </g>

  <!-- Stage 3: Gap Analysis & Truthful Scoping -->
  <g transform="translate(504, 136)">
    <rect width="216" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="216" height="8" rx="4" fill="#D97706"/>
    
    <rect x="16" y="24" width="36" height="36" rx="8" fill="#FEF3C7"/>
    <!-- Search / balance icon -->
    <circle cx="33" cy="41" r="7" stroke="#D97706" stroke-width="2" fill="none"/>
    <path d="M38 46L44 52" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>

    <text x="16" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">3. Gap Assessment</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#D97706">Avoid the "All" Trap</text>

    <text x="16" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">Accuracy Checkpoints:</text>
    <text x="16" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Audit legacy portals &amp; VPNs</text>
    <text x="16" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Check third-party IT access</text>
    <text x="16" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Identify unpatched servers</text>
    <text x="16" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Disclose partial rollouts</text>
    <text x="16" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Never check "Yes" on hope</text>

    <rect x="12" y="296" width="192" height="72" rx="6" fill="#FFFBEB"/>
    <text x="20" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#B45309">OBJECTIVE</text>
    <text x="20" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350F">Identify genuine gaps</text>
    <text x="20" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350F">before application review.</text>
  </g>

  <!-- Stage 4: Broker Consultation -->
  <g transform="translate(736, 136)">
    <rect width="216" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="216" height="8" rx="4" fill="#7C3AED"/>
    
    <rect x="16" y="24" width="36" height="36" rx="8" fill="#EDE9FE"/>
    <!-- Chat / consultation icon -->
    <path d="M25 43C25 36.9 29.5 32 35 32C40.5 32 45 36.9 45 43C45 49.1 40.5 54 35 54C33.2 54 31.5 53.5 30 52.6L25 54L26.5 49.5C25.6 47.6 25 45.4 25 43Z" stroke="#7C3AED" stroke-width="2" fill="none"/>

    <text x="16" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">4. Policy Terms</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#7C3AED">Clarify Expectations</text>

    <text x="16" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">Questions to Ask Broker:</text>
    <text x="16" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Ransomware sublimit caps</text>
    <text x="16" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Retention / deductible size</text>
    <text x="16" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Mandatory policy warranties</text>
    <text x="16" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Pre-approved incident panel</text>
    <text x="16" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Notice timing triggers</text>

    <rect x="12" y="296" width="192" height="72" rx="6" fill="#F5F3FF"/>
    <text x="20" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#6D28D9">OBJECTIVE</text>
    <text x="20" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4C1D95">Understand coverage limits</text>
    <text x="20" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4C1D95">and contract warranties.</text>
  </g>

  <!-- Stage 5: Accurate Submission -->
  <g transform="translate(968, 136)">
    <rect width="192" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="192" height="8" rx="4" fill="#059669"/>
    
    <rect x="16" y="24" width="36" height="36" rx="8" fill="#D1FAE5"/>
    <!-- Stamp / verified check icon -->
    <circle cx="34" cy="42" r="10" stroke="#059669" stroke-width="2" fill="none"/>
    <path d="M30 42L33 45L38 39" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="16" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">5. Submission</text>
    <text x="16" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">Defensible Record</text>

    <text x="16" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">Operational Outcome:</text>
    <text x="16" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• True application answers</text>
    <text x="16" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Evidence binder retained</text>
    <text x="16" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Ongoing control hygiene</text>
    <text x="16" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Rescission risk mitigated</text>
    <text x="16" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">• Seamless future renewals</text>

    <rect x="12" y="296" width="168" height="72" rx="6" fill="#ECFDF5"/>
    <text x="20" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857">CORE BENEFIT</text>
    <text x="20" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#064E3B">Protects claims from</text>
    <text x="20" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#064E3B">misrepresentation disputes.</text>
  </g>
</svg>
