<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <!-- Card Background -->
  <rect width="1200" height="560" rx="20" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="558" rx="19" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="40" y="32" width="220" height="26" rx="6" fill="#CCFBF1"/>
  <text x="50" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E" letter-spacing="0.08em">NETWORK ARCHITECTURE</text>
  <text x="40" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Small Business Office Wi-Fi Network Segmentation</text>
  <text x="40" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Isolating corporate computers, visitor mobile devices, and IoT hardware prevents lateral network attacks.</text>

  <!-- Subnet 1: Primary Corporate Wi-Fi -->
  <g transform="translate(40, 136)">
    <rect width="354" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="354" height="8" rx="4" fill="#0F766E"/>
    
    <rect x="20" y="24" width="40" height="40" rx="10" fill="#CCFBF1"/>
    <!-- Laptop / Lock icon -->
    <rect x="28" y="34" width="24" height="16" rx="2" stroke="#0F766E" stroke-width="2" fill="none"/>
    <path d="M26 50H54" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>

    <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0F172A">1. Primary Corporate Wi-Fi</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">Trusted Company Workstations</text>

    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Allowed Devices:</text>
    <text x="20" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Company-managed laptops &amp; desktops</text>
    <text x="20" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• File servers &amp; local NAS backup units</text>
    <text x="20" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Verified administrative workstations</text>

    <text x="20" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Security Standards:</text>
    <text x="20" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• WPA3-Personal or WPA2/WPA3 Mixed</text>
    <text x="20" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Complex 20+ character network key</text>
    <text x="20" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Stored in business password vault</text>

    <rect x="16" y="336" width="322" height="32" rx="6" fill="#F0FDFA"/>
    <text x="26" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E">ACCESS: Full internet &amp; internal file shares</text>
  </g>

  <!-- Subnet 2: Guest Network -->
  <g transform="translate(424, 136)">
    <rect width="354" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="354" height="8" rx="4" fill="#0284C7"/>
    
    <rect x="20" y="24" width="40" height="40" rx="10" fill="#E0F2FE"/>
    <!-- User Smartphone icon -->
    <rect x="32" y="32" width="16" height="24" rx="3" stroke="#0284C7" stroke-width="2" fill="none"/>
    <circle cx="40" cy="50" r="1" fill="#0284C7"/>

    <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0F172A">2. Isolated Guest Wi-Fi</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0284C7">Visitors &amp; Personal Employee Phones</text>

    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Allowed Devices:</text>
    <text x="20" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Client &amp; visitor smartphones/laptops</text>
    <text x="20" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Employee personal mobile devices (BYOD)</text>
    <text x="20" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Delivery &amp; external contractor devices</text>

    <text x="20" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Security Standards:</text>
    <text x="20" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Client Isolation (AP Isolation) enabled</text>
    <text x="20" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Zero visibility into internal computers</text>
    <text x="20" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Password rotated quarterly</text>

    <rect x="16" y="336" width="322" height="32" rx="6" fill="#F0F9FF"/>
    <text x="26" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284C7">ACCESS: Internet only (zero local network access)</text>
  </g>

  <!-- Subnet 3: IoT & Smart Hardware Subnet -->
  <g transform="translate(808, 136)">
    <rect width="352" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="352" height="8" rx="4" fill="#6366F1"/>
    
    <rect x="20" y="24" width="40" height="40" rx="10" fill="#EEF2FF"/>
    <!-- IoT / Device icon -->
    <rect x="30" y="34" width="20" height="18" rx="2" stroke="#6366F1" stroke-width="2" fill="none"/>
    <circle cx="40" cy="43" r="3" stroke="#6366F1" stroke-width="2" fill="none"/>

    <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0F172A">3. IoT &amp; Office Hardware</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6366F1">Printers, Cameras &amp; Smart Devices</text>

    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Allowed Devices:</text>
    <text x="20" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Wireless office printers &amp; scanners</text>
    <text x="20" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Security cameras &amp; smart doorbells</text>
    <text x="20" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Smart TVs, smart plugs &amp; thermostats</text>

    <text x="20" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Security Standards:</text>
    <text x="20" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Dedicated VLAN or separated guest SSID</text>
    <text x="20" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Blocked from communicating with laptops</text>
    <text x="20" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• UPnP disabled on router firewall</text>

    <rect x="16" y="336" width="320" height="32" rx="6" fill="#EEF2FF"/>
    <text x="26" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6366F1">ACCESS: Internet only (prevents pivot into PCs)</text>
  </g>
</svg>
