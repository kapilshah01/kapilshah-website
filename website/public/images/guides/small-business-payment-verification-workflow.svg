<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <!-- Background Card -->
  <rect width="1200" height="600" rx="20" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="598" rx="19" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="40" y="36" width="300" height="28" rx="6" fill="#CCFBF1"/>
  <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E" letter-spacing="0.08em">SAFE VERIFICATION WORKFLOW</text>
  <text x="40" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Out-of-Band Payment &amp; Bank-Detail Verification</text>
  <text x="40" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Never verify an unexpected payment or changed bank detail using the email that requested it.</text>

  <!-- Step 1: Request Arrives -->
  <g transform="translate(40, 150)">
    <rect width="200" height="390" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="8" rx="4" fill="#F59E0B"/>
    <circle cx="36" cy="40" r="16" fill="#FEF3C7"/>
    <text x="36" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">1</text>
    <text x="64" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Payment Request</text>
    
    <!-- Mini UI / Email Graphic -->
    <rect x="20" y="74" width="160" height="96" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="30" y="86" width="70" height="6" rx="3" fill="#94A3B8"/>
    <rect x="30" y="98" width="120" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="30" y="112" width="140" height="18" rx="4" fill="#FEF3C7"/>
    <text x="36" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#B45309">CHANGE BANK DETAILS</text>
    <rect x="30" y="138" width="90" height="6" rx="3" fill="#94A3B8"/>

    <text x="20" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Triggers Caution:</text>
    <text x="20" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Changed bank details</text>
    <text x="20" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Urgent wire demand</text>
    <text x="20" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Executive bypass</text>
    <text x="20" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Unexpected invoice</text>

    <rect x="20" y="322" width="160" height="46" rx="8" fill="#FEF3C7"/>
    <text x="100" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">RULE APPLIES</text>
    <text x="100" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400E" text-anchor="middle">Do not execute yet</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M246 345H270" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <path d="M266 339L272 345L266 351" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: STOP & Pause -->
  <g transform="translate(276, 150)">
    <rect width="200" height="390" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="8" rx="4" fill="#EF4444"/>
    <circle cx="36" cy="40" r="16" fill="#FEE2E2"/>
    <text x="36" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">2</text>
    <text x="64" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">STOP &amp; Pause</text>

    <!-- Stop Sign Visual -->
    <rect x="20" y="74" width="160" height="96" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
    <circle cx="100" cy="112" r="26" fill="#EF4444"/>
    <rect x="88" y="110" width="24" height="4" rx="2" fill="#FFFFFF"/>
    <text x="100" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">PAUSE PAYMENT</text>

    <text x="20" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Mandatory Rules:</text>
    <text x="20" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Do NOT click "Reply"</text>
    <text x="20" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Do NOT call number</text>
    <text x="30" y="259" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">listed on email/invoice</text>
    <text x="20" y="281" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Do NOT rush because</text>
    <text x="30" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">sender claims urgency</text>

    <rect x="20" y="322" width="160" height="46" rx="8" fill="#FEE2E2"/>
    <text x="100" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">NO OVERRIDE</text>
    <text x="100" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#991B1B" text-anchor="middle">Policy protects staff</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M482 345H506" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <path d="M502 339L508 345L502 351" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: Out-of-Band Verification -->
  <g transform="translate(512, 150)">
    <rect width="200" height="390" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="8" rx="4" fill="#0F766E"/>
    <circle cx="36" cy="40" r="16" fill="#CCFBF1"/>
    <text x="36" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F766E" text-anchor="middle">3</text>
    <text x="64" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Verify Separately</text>

    <!-- Phone / Channel Visual -->
    <rect x="20" y="74" width="160" height="96" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <circle cx="100" cy="112" r="22" fill="#0F766E"/>
    <!-- Phone handset icon -->
    <path d="M94 105C94 104 96 102 98 102H102C104 102 105 103 105 105L106 108C106 109 105 110 104 111L103 112C104 115 106 117 109 118L110 117C111 116 112 115 113 115L116 116C118 116 119 117 119 119V123C119 125 117 127 115 127C104 127 94 117 94 106V105Z" fill="#FFFFFF"/>
    <text x="100" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">KNOWN CHANNEL</text>

    <text x="20" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Trusted Procedure:</text>
    <text x="20" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Call established</text>
    <text x="30" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">number from ERP/contract</text>
    <text x="20" y="259" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Read back routing</text>
    <text x="30" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">and account number</text>
    <text x="20" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Confirm with finance lead</text>

    <rect x="20" y="322" width="160" height="46" rx="8" fill="#CCFBF1"/>
    <text x="100" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">OUT-OF-BAND</text>
    <text x="100" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#115E59" text-anchor="middle">Independent channel</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M718 345H742" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <path d="M738 339L744 345L738 351" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4: Second-Person Approval -->
  <g transform="translate(748, 150)">
    <rect width="200" height="390" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="8" rx="4" fill="#0284C7"/>
    <circle cx="36" cy="40" r="16" fill="#E0F2FE"/>
    <text x="36" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0284C7" text-anchor="middle">4</text>
    <text x="64" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Dual Approval</text>

    <!-- Two People Sign-off Visual -->
    <rect x="20" y="74" width="160" height="96" rx="8" fill="#F0F9FF" stroke="#BAE6FD"/>
    <circle cx="85" cy="112" r="18" fill="#0284C7"/>
    <circle cx="115" cy="112" r="18" fill="#38BDF8"/>
    <path d="M80 112L84 116L91 108" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M110 112L114 116L121 108" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369A1" text-anchor="middle">2-PERSON REVIEW</text>

    <text x="20" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Dual Control:</text>
    <text x="20" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Threshold based</text>
    <text x="30" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">(e.g. over $2,500 / $5,000)</text>
    <text x="20" y="259" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Second authorized</text>
    <text x="30" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">person verifies evidence</text>
    <text x="20" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• No single person can wire</text>

    <rect x="20" y="322" width="160" height="46" rx="8" fill="#E0F2FE"/>
    <text x="100" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284C7" text-anchor="middle">DUAL CONTROL</text>
    <text x="100" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0369A1" text-anchor="middle">Prevents single failure</text>
  </g>

  <!-- Arrow 4 to 5 -->
  <path d="M954 345H978" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <path d="M974 339L980 345L974 351" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 5: Proceed / Reject & Document -->
  <g transform="translate(984, 150)">
    <rect width="176" height="390" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="176" height="8" rx="4" fill="#10B981"/>
    <circle cx="32" cy="40" r="16" fill="#D1FAE5"/>
    <text x="32" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">5</text>
    <text x="58" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Action &amp; Audit</text>

    <!-- Outcome Split Visual -->
    <rect x="16" y="74" width="144" height="44" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="28" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669">PROCEED</text>
    <text x="28" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#047857">Details confirmed</text>

    <rect x="16" y="126" width="144" height="44" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
    <text x="28" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#DC2626">REJECT &amp; ALERT</text>
    <text x="28" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#B91C1C">Report BEC attempt</text>

    <text x="16" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Document Record:</text>
    <text x="16" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Date &amp; time of check</text>
    <text x="16" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Name of person called</text>
    <text x="16" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Phone number used</text>
    <text x="16" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">• Approver signatures</text>

    <rect x="16" y="322" width="144" height="46" rx="8" fill="#ECFDF5"/>
    <text x="88" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">COMPLETE RECORD</text>
    <text x="88" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#065F46" text-anchor="middle">Auditable proof</text>
  </g>
</svg>
